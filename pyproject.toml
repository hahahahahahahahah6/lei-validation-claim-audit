[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lei-validation-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented identifier claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
lei-validation-claim-audit = "lei_validation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["lei_validation_claim_audit*"]
